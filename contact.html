<!doctype html>
<html lang="en">
<head>
<title>Contact | Dealership fiXit Podcast</title>
<meta name="description" content="Contact the Dealership fiXit Podcast. Questions, topic ideas, story tips for the Rundown, press, and partnerships.">
<!--HEAD-->
</head>
<body>
<main>
  <section class="page-head"><div class="wrap">
    <div class="eyebrow">Contact</div>
    <h1>Say <span class="script">hello</span></h1>
    <p class="muted" style="max-width:640px">Topic ideas, story tips for the Rundown, press requests, or just a note about an episode. We read everything.</p>
  </div></section>
  <section class="section tight"><div class="wrap" style="display:grid;gap:28px;grid-template-columns:1.2fr .8fr;align-items:start">
    <div class="panel glow">
      <form class="ff" data-fixit="contact" novalidate style="position:relative">
        <div class="row"><label>Name<input name="name" required></label><label>Email<input type="email" name="email" required></label></div>
        <div class="row"><label>Dealership or company<input name="company"></label><label>Reason<select name="topic"><option>Topic idea</option><option>Story tip for the Rundown</option><option>Feedback on an episode</option><option>Press or media</option><option>Add a ticker to the market tracker</option><option>Something else</option></select></label></div>
        <label>Message<textarea name="message" required></textarea></label>
        <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off">
        <button class="btn btn-pink" type="submit">Send</button>
        <div class="form-msg"></div>
      </form>
    </div>
    <div>
      <div class="panel" style="margin-bottom:18px"><div class="eyebrow">Quick links</div><ul style="list-style:none;padding:0;margin:0;display:grid;gap:8px"><li><a href="/guest">Pitch a guest →</a></li><li><a href="/sponsor">Sponsor the show →</a></li><li><a href="https://linktr.ee/dealershipfixit" target="_blank" rel="noopener">All our links →</a></li></ul></div>
      <div class="panel"><div class="eyebrow">Find us</div><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn btn-ghost btn-sm" href="https://www.youtube.com/@dealershipfixit" target="_blank" rel="noopener">YouTube</a><a class="btn btn-ghost btn-sm" href="https://open.spotify.com/show/32L4getcOmBCYL3fRxDlyH" target="_blank" rel="noopener">Spotify</a><a class="btn btn-ghost btn-sm" href="https://podcasts.apple.com/us/podcast/id1449367603" target="_blank" rel="noopener">Apple</a><a class="btn btn-ghost btn-sm" href="https://www.linkedin.com/company/dealershipfixit" target="_blank" rel="noopener">LinkedIn</a></div></div>
    </div>
  </div></section>
</main>
<style>@media (max-width:860px){.section .wrap[style*="grid-template-columns:1.2fr"]{grid-template-columns:1fr!important}}</style>
</body>
</html>
